# =============================================================
#  MagicBridge nginx configuration
#  Drop into /etc/nginx/sites-available/magicbridge
#  symlink → /etc/nginx/sites-enabled/magicbridge
# =============================================================

# Redirect plain HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # ANONYMITY (MAGICBRIDGE_SYSTEM.md §2): without this, nginx's http-level
    # default access_log (/var/log/nginx/access.log, on the SD card) records
    # every visitor's IP + User-Agent here. Since every first visit hits :80
    # before being redirected to :443, that persistently leaked client IPs to
    # disk. The :443 block logs to the RAM tmpfs; a bare redirect needs no log
    # at all, so turn it off entirely — nothing sensitive reaches the card.
    access_log off;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Don't advertise the exact nginx version in the Server header / error pages
    # (a generic appliance wouldn't). Reduces the bespoke-reverse-proxy tell.
    server_tokens off;

    # TLS
    ssl_certificate     /etc/magicbridge/ssl/cert.pem;
    ssl_certificate_key /etc/magicbridge/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "same-origin"     always;
    add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;

    # "Starting up" page instead of a bare 502.
    # nginx binds :443 well before magicbridge.py binds :8080: the backend is
    # gated behind mb-provision (up to 40s connectivity poll), mb-hdmi-init
    # (10x2s no-signal wait, plus a 30x1s CSI-node wait on non-C790 units) and
    # video.start(), all before web.TCPSite. Someone who opens the UI during
    # boot - especially with no HDMI attached yet - got an unexplained "502 Bad
    # Gateway" that later started working on its own, with nothing saying to
    # wait. This self-refreshes, so it resolves itself the moment :8080 is up.
    error_page 502 503 504 /_starting.html;
    location = /_starting.html {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 5 always;
        return 200 '<!doctype html><meta charset=utf-8><title>MagicBridge is starting</title><meta http-equiv=refresh content=5><meta name=viewport content="width=device-width,initial-scale=1"><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#050b14;color:#a9cfe0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}h1{font-size:17px;font-weight:700;color:#22d3ee;margin:0 0 8px}p{margin:0;font-size:12.5px;color:#6f93a8}</style><div><h1>MagicBridge is starting</h1><p>This page refreshes on its own.</p></div>';
    }

    # KVM web UI (proxied; magicbridge.py enforces login before serving it)
    location = / {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        add_header Cache-Control "no-store";
        # nginx discards ALL inherited add_header directives in any location that
        # sets its own, so the server-level security headers above never reached
        # the operator UI (it has add_header Cache-Control here). Repeat them so
        # the main page actually gets nosniff / frame / referrer protection.
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "same-origin"     always;
        add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # Login page for the KVM UI
    location = /login {
        proxy_pass         http://127.0.0.1:8080/login;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    # The forced first-run password page. This config is a deliberate ALLOWLIST -
    # there is no catch-all `location /`, so an unlisted path 404s at nginx and
    # never reaches the backend. That is right for a device meant to expose as
    # little as possible, but it means every new backend route needs an entry
    # here. Missing this one locked the owner out completely: the backend
    # redirected every request to /first-run, and nginx answered 404 for it, so
    # the unit served nothing at all until nginx was fixed.
    location = /first-run {
        proxy_pass         http://127.0.0.1:8080/first-run;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    location = /logout {
        proxy_pass         http://127.0.0.1:8080/logout;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    location /static/ {
        alias /opt/magicbridge/web/static/;
        expires 1d;
        add_header Cache-Control "public";
        # Re-assert the server-level security headers (nginx drops inherited ones
        # here because this block sets its own Cache-Control add_header).
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "same-origin"     always;
        add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # MJPEG stream from ustreamer / ffmpeg
    # Gate the MJPEG stream + snapshots behind the session, via a subrequest to
    # the app's /api/authcheck (which the auth middleware 401s when not logged
    # in). Without this, /stream and /snapshot - proxied straight to ustreamer,
    # bypassing the app - were viewable by anyone who could reach the device.
    # The browser sends the mb_sess cookie on the same-origin <img>/fetch, and
    # auth_request forwards it, so the logged-in UI is unaffected.
    location = /_streamauth {
        internal;
        proxy_pass              http://127.0.0.1:8080/api/authcheck;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location /stream {
        auth_request       /_streamauth;
        proxy_pass         http://127.0.0.1:8081/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Allow large multipart frames
        client_max_body_size 0;
        # CORS for same-origin iframe use
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"  always;
        # Re-assert the server-level security headers (the CORS add_headers above
        # make nginx drop every inherited one). X-Frame-Options is safe here:
        # /stream is only ever a same-origin <img>, never framed cross-origin, and
        # X-Frame-Options doesn't apply to <img> loads regardless.
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "same-origin"     always;
        add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # ustreamer snapshot endpoint
    location /snapshot {
        auth_request       /_streamauth;
        proxy_pass         http://127.0.0.1:8081/snapshot;
        proxy_buffering    off;
        add_header Cache-Control "no-store";
        # Re-assert the server-level security headers (dropped here because this
        # block sets its own Cache-Control add_header).
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "same-origin"     always;
        add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # Janus WebRTC Gateway - HTTP API (C790/H.264 video path, additive;
    # unused/harmless while mode stays "mjpeg"). Not actually wired up:
    # install_janus_webrtc.sh builds Janus with --disable-all-transports
    # --enable-websockets only (the frontend's Janus client only ever
    # talks to /janus-ws), so nothing listens on 8088 today. Left in
    # place in case the HTTP/REST transport is enabled later.
    location /janus-http/ {
        # B7: same auth gate as /stream. Without it, /janus-http/ (and /janus-ws
        # below) reach Janus with no credential check - an unauthenticated
        # WebRTC screen-capture path once the H.264 mode is enabled.
        auth_request       /_streamauth;
        proxy_pass         http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 30s;
    }

    # Janus WebRTC Gateway - WebSocket API (C790/H.264 video path, actively used)
    location /janus-ws {
        # B7: require a valid MagicBridge session before the WS reaches Janus.
        # The logged-in UI sends the mb_sess cookie on this same-origin WS and
        # auth_request forwards it, so authenticated clients are unaffected; an
        # unauthenticated client gets 401 at nginx and never touches Janus (8188
        # is also firewall-dropped from the LAN as defense-in-depth).
        auth_request       /_streamauth;
        proxy_pass         http://127.0.0.1:8188/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MagicBridge KVM API + WebSocket
    location /ws {
        proxy_pass         http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        # Pin X-Real-IP like every other block, so a client-supplied header
        # can't reach the WS handler (which records it into the viewer list).
        # Without this a viewer could plant an arbitrary "IP" string; the UI now
        # also HTML-escapes it, but not accepting the spoofed value is cleaner.
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Stealth admin panel
    # Access at: https://<host>/stealth/
    # Auth, USB identity, MAC, Tailscale, DuckDNS, WiFi, backup, logs
    location /stealth/ {
        proxy_pass         http://127.0.0.1:7777/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # Strip /stealth prefix before forwarding
        # (Flask app is mounted at /, nginx strips /stealth)
    }

    # NOTE: there used to be a "location /api/wifi/" block here proxying
    # straight to the stealth Flask app on 7777 with no auth at all - a
    # leftover from before the main KVM page had its own /api/networks
    # endpoint. The main page has used /api/networks (authenticated via
    # magicbridge.py's auth_middleware, see location /api/ above) for a
    # while now, so that passthrough had no legitimate caller left and was
    # just an open door: anyone reaching this host over HTTPS could add/
    # remove/force-connect WiFi networks with zero credentials. Removed;
    # the stealth panel's own WiFi controls still work fine through
    # location /stealth/ since stealth-dashboard.py's /api/wifi/* routes
    # now check the panel's own session (and CSRF for POSTs) directly.

    # Health check
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        # Re-assert the server-level security headers (dropped here because this
        # block sets its own Content-Type add_header).
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "same-origin"     always;
        add_header Permissions-Policy "pointer-lock=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # Block everything else
    location / {
        return 404;
    }

    # Logging - tmpfs (RAM-only), wiped on reboot/power-loss. See
    # /var/log/magicbridge-ram tmpfs mount (fstab) and
    # /etc/logrotate.d/magicbridge-ram for growth bounding.
    access_log /var/log/magicbridge-ram/nginx-access.log;
    error_log  /var/log/magicbridge-ram/nginx-error.log;
}
